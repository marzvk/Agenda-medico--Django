{% extends "base_auth.html" %}

{% block title %}Enlace expirado · MedAgenda{% endblock %}

{% block content %}
<div class="ma-hoja">
    <div class="ma-hoja__cuerpo text-center py-4">
        <div class="d-flex justify-content-center mb-3">
            <span class="ma-avatar" style="width:52px;height:52px;font-size:24px;border-radius:12px;">
                <i class="bi bi-clock-history"></i>
            </span>
        </div>
        <h1 class="ma-titulo--chico mb-2">El enlace <span class="ma-destacar">expiró</span></h1>
        <p class="texto-pino small mb-0">
            Los enlaces de activación o recuperación duran <strong>72 horas</strong>.
            Volvé a solicitar uno nuevo desde el inicio de sesión.
        </p>
    </div>
</div>

<div class="text-center mt-3">
    <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ir al inicio de sesión
    </a>
</div>
{% endblock %}
